---
version: 0.6.4-dev
slug: open3e-develop
name: Open3e Develop
description: Connect to E3 Controls through CAN using Open3e develop
url: https://github.com/zcerar5/ha-addons/tree/main/open3e-develop
arch:
  - amd64
  - aarch64
hassio_api: true
host_network: true
image: ghcr.io/zcerar5/ha-addon-open3e-develop
init: false
options:
  configurations:
    can: can0
    Listen_Topic: open3e-develop/cmnd
    Server_Topic: open3e-develop
    MQTT_FormatString: "{device}_{ecuAddr:03X}_{didNumber}_{didName}"
    MQTT_ClientID: open3e-develop
privileged:
  - NET_ADMIN
schema:
  configurations:
    can: str
    Listen_Topic: str
    Server_Topic: str
    MQTT_FormatString: str
    MQTT_ClientID: str
services:
  - mqtt:need
startup: services
