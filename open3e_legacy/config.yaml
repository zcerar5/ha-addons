---
version: 0.6.7
slug: open3e_legacy
name: Open3e Legacy
description: Classic Open3e MQTT listener for Open3e HACS
url: https://github.com/zcerar5/ha-addons/tree/main/open3e_legacy
arch:
  - amd64
  - aarch64
hassio_api: true
host_network: true
init: false
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:console
panel_title: Open3e Legacy Terminal
panel_admin: true
options:
  configurations:
    can: can0
    Listen_Topic: open3e/cmnd
    Server_Topic: open3e
    MQTT_FormatString: "{device}_{ecuAddr:03X}_{didNumber}_{didName}"
    MQTT_ClientID: open3e
privileged:
  - NET_ADMIN
schema:
  configurations:
    can: str
    Listen_Topic: str
    Server_Topic: str
    MQTT_FormatString: str
    MQTT_ClientID: str
services:
  - mqtt:need
startup: services
