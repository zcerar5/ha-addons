configuration:
  configurations:
    name: Open3e settings
    description: Configure the CAN interface and MQTT topics used by Open3e.
    fields:
      can:
        name: CAN interface
        description: Host CAN network interface connected to the E3 device.
      Web_UI_Enabled:
        name: Enable Web UI mode
        description: Run Open3e Web UI instead of the legacy MQTT listener used by the Open3e HACS integration.
      Web_UI_Port:
        name: Web UI port
        description: Port used by Open3e Web UI when Web UI mode is enabled.
      Listen_Topic:
        name: Listen topic
        description: MQTT topic where Open3e listens for commands.
      Server_Topic:
        name: Server topic
        description: MQTT topic where Open3e publishes data.
      MQTT_FormatString:
        name: MQTT format string
        description: Format used to build MQTT entity topic names.
      MQTT_ClientID:
        name: MQTT client ID
        description: Client ID used by Open3e when connecting to the MQTT broker.
      MQTT_Publish_JSON:
        name: Publish JSON
        description: Publish complex values as JSON when Web UI mode is enabled.
      Auto_Select_HACS_Datapoints:
        name: Auto-select HACS datapoints
        description: Enable the base datapoints used by the Open3e HACS integration when Web UI mode is enabled.
      Auto_Select_Room_Datapoints:
        name: Auto-select room datapoints
        description: Enable discovered room temperature and humidity datapoints when Web UI mode is enabled.
