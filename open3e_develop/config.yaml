---
version: 0.6.7-dev
slug: open3e_develop
name: Open3e Develop
description: Connect to E3 Controls through CAN using Open3e develop with Web UI
url: https://github.com/zcerar5/ha-addons/tree/main/open3e_develop
arch:
  - amd64
  - aarch64
hassio_api: true
host_network: true
image: ghcr.io/zcerar5/ha-addon-open3e-develop
init: false
ports:
  5051/tcp: 5051
ports_description:
  5051/tcp: Open3e Develop Web UI
webui: http://[HOST]:[PORT:5051]
watchdog: http://[HOST]:[PORT:5051]/api/live-status
options:
  configurations:
    can: can0
    Web_UI_Port: 5051
    Listen_Topic: open3e_develop/cmnd
    Server_Topic: open3e_develop
    MQTT_FormatString: "{didNumber}_{didName}"
    MQTT_ClientID: open3e_develop
    MQTT_Publish_JSON: false
    Auto_Select_HACS_Datapoints: true
    Auto_Select_Room_Datapoints: true
privileged:
  - NET_ADMIN
schema:
  configurations:
    can: str
    Web_UI_Port: port
    Listen_Topic: str
    Server_Topic: str
    MQTT_FormatString: str
    MQTT_ClientID: str
    MQTT_Publish_JSON: bool
    Auto_Select_HACS_Datapoints: bool
    Auto_Select_Room_Datapoints: bool
services:
  - mqtt:need
startup: services
