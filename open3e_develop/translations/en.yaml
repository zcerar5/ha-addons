configuration:
  configurations:
    name: Open3e develop settings
    description: Configure the CAN interface and MQTT topics used by the Open3e develop add-on.
    fields:
      can:
        name: CAN interface
        description: Host CAN network interface connected to the E3 device.
      Web_UI_Port:
        name: Web UI port
        description: Host port used by the Open3e Develop web interface.
      Listen_Topic:
        name: Listen topic
        description: MQTT topic where Open3e listens for commands.
      Server_Topic:
        name: Server topic
        description: MQTT topic where Open3e publishes data.
      MQTT_FormatString:
        name: MQTT format string
        description: Format used to build MQTT entity topic names.
      MQTT_ClientID:
        name: MQTT client ID
        description: Client ID used by Open3e when connecting to the MQTT broker.
      MQTT_Publish_JSON:
        name: Publish JSON
        description: Publish each datapoint as one JSON message instead of split subtopics. Keep disabled for Home Assistant subfield sensors.
      Auto_Select_HACS_Datapoints:
        name: Auto-select HACS datapoints
        description: Automatically enable the base datapoints used by the Open3e HACS integration.
      Auto_Select_Room_Datapoints:
        name: Auto-select room datapoints
        description: Automatically enable discovered room temperature and humidity datapoints at low polling priority.
