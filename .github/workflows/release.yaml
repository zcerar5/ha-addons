name: Create Release

on:
  workflow_dispatch:
    inputs:
      manual_notes:
        description: 'Additional notes to display above the Changes section (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' open3e/config.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git tag --list | grep -qx "${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get previous tag
        id: prev_tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Generate release notes body
        id: notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"
          NOTES_FILE="/tmp/release_notes.md"

          if [ -z "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log --pretty=format:"- %s" | head -20)
          else
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s")
          fi

          # Deduplicate and skip empty or merge commits
          COMMIT_LOG=$(echo "$COMMIT_LOG" | grep -v '^- Merge ' | sort -u)

          # Extract supported architectures from config.yaml
          ARCHS=$(awk '/^arch:/{f=1;next} f && /^ *- /{gsub(/^ *- /,""); printf "%s`%s`", sep, $0; sep=", "} f && /^[^ ]/{exit}' open3e/config.yaml)

          MANUAL_NOTES="${{ inputs.manual_notes }}"

          # Write notes to a file to avoid shell backtick / special-char interpretation
          printf '## Open3e Add-On v%s\n\n' "$VERSION" > "$NOTES_FILE"
          if [ -n "$MANUAL_NOTES" ]; then
            printf '%s\n\n' "$MANUAL_NOTES" >> "$NOTES_FILE"
          fi
          printf '### Changes\n\n' >> "$NOTES_FILE"
          if [ -z "$COMMIT_LOG" ]; then
            printf '- Minor updates and improvements\n' >> "$NOTES_FILE"
          else
            printf '%s\n' "$COMMIT_LOG" >> "$NOTES_FILE"
          fi
          printf '\n### Add-On Details\n\n| Property | Value |\n| --- | --- |\n' >> "$NOTES_FILE"
          printf '| Version | `%s` |\n' "$VERSION" >> "$NOTES_FILE"
          printf '| Add-On | Open3e |\n' >> "$NOTES_FILE"
          printf '| Supported Architectures | %s |\n' "$ARCHS" >> "$NOTES_FILE"

          echo "notes_file=${NOTES_FILE}" >> $GITHUB_OUTPUT

      - name: Create GitHub release and tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Open3e Add-On v${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --latest
